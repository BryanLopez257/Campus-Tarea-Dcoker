# Copia este archivo fuera del repositorio y reemplaza CAMBIAR_PASSWORD
# en ambos campos antes de aplicar la copia con kubectl apply -f.
# En DATABASE_URL, codifica los caracteres reservados de la contraseña.
apiVersion: v1
kind: Secret
metadata:
  name: campus-db
  namespace: campustareas
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: CAMBIAR_PASSWORD
  POSTGRES_DB: campus
  DATABASE_URL: postgres://app:CAMBIAR_PASSWORD@postgres:5432/campus
