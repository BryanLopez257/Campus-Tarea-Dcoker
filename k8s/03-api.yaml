apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-api
  namespace: campustareas
  annotations:
    kubernetes.io/change-cause: "Version inicial 1.0.0"
spec:
  replicas: 3
  minReadySeconds: 5
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: campus-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: campus-api
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: campus-api
      containers:
        - name: api
          image: campus-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: campus-db
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: campus-api
  namespace: campustareas
spec:
  type: NodePort
  selector:
    app: campus-api
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
