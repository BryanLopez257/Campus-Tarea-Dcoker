apiVersion: apps/v1
kind: Deployment
metadata:
  name: carga
  namespace: campustareas
spec:
  replicas: 4
  selector:
    matchLabels:
      app: carga
  template:
    metadata:
      labels:
        app: carga
    spec:
      containers:
        - name: carga
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - while true; do wget -q -O /dev/null http://campus-api/v1/trabajo-pesado || sleep 1; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
