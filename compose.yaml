x-api: &api
  build:
    context: ./api
    args:
      APP_VERSION: 1.0.0
  restart: unless-stopped
  environment:
    DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:?Crea .env a partir de .env.example}@db:5432/campus
    PORT: 3000
    APP_VERSION: 1.0.0
  depends_on:
    db:
      condition: service_healthy

services:
  api1:
    <<: *api

  api2:
    <<: *api

  api3:
    <<: *api

  balanceador:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Crea .env a partir de .env.example}
      POSTGRES_DB: campus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d campus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
